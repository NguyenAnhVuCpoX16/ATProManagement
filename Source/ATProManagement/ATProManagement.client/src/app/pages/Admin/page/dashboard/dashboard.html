<app-toolbar title="Dashboard"></app-toolbar>
<div class="control-section">

  <ejs-dashboardlayout
    [columns]="columns"
    [cellSpacing]="cellSpacing"
    [cellAspectRatio]="cellAspectRatio">

    <e-panels>

      <!-- COLUMN -->
      <e-panel [sizeX]="columnSizeX" [sizeY]="columnSizeY">
        <ng-template #header>
          Sales Performance
        </ng-template>

        <ng-template #content>
          <ejs-chart
            [primaryXAxis]="columnChartprimaryXAxis"
            [primaryYAxis]="columnChartprimaryYAxis">

            <e-series-collection>
              <e-series
                [dataSource]="columnChartDataCollection"
                type="Column"
                xName="Period"
                yName="Percentage"
                [fill]="series1Fill">
              </e-series>

              <e-series
                [dataSource]="columnChartData"
                type="Column"
                xName="Period"
                yName="Percentage"
                [fill]="series2Fill">
              </e-series>
            </e-series-collection>

          </ejs-chart>
        </ng-template>
      </e-panel>

      <!-- PIE -->
      <e-panel [sizeX]="pieSizeX" [sizeY]="pieSizeY" [col]="pieColumn">
        <ng-template #header>
          Product Sales
        </ng-template>

        <ng-template #content>
          <ejs-accumulationchart
            [tooltip]="pieTooltipSetting"
            [legendSettings]="pielegendSettings">

            <e-accumulation-series-collection>
              <e-accumulation-series
                [dataSource]="data"
                xName="Product"
                yName="Percentage"
                innerRadius="40%">
              </e-accumulation-series>
            </e-accumulation-series-collection>

          </ejs-accumulationchart>
        </ng-template>
      </e-panel>

      <!-- SPLINE -->
      <e-panel [sizeX]="splineSizeX" [sizeY]="splineSizeY" [row]="splineRow">

        <ng-template #header>
          Monthly Trend
        </ng-template>

        <ng-template #content>
          <ejs-chart
            [primaryXAxis]="spLineAreaprimaryXAxis"
            [primaryYAxis]="spLineAreaprimaryYAxis">

            <e-series-collection>

              <e-series
                [dataSource]="spLineAreaData"
                type="SplineArea"
                xName="Period"
                yName="Percentage"
                [fill]="spLineAreaFill">
              </e-series>

              <e-series
                [dataSource]="spLineAreaData2"
                type="SplineArea"
                xName="Period"
                yName="Percentage"
                [fill]="spLineAreaFill1">
              </e-series>

            </e-series-collection>

          </ejs-chart>
        </ng-template>

      </e-panel>

    </e-panels>

  </ejs-dashboardlayout>

</div>
